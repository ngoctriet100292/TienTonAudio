version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tientonaudio_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-tientonaudio}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tientonaudio}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - tientonaudio_net

  redis:
    image: redis:7-alpine
    container_name: tientonaudio_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - tientonaudio_net

  # pgAdmin - database GUI (start with: docker compose --profile tools up -d)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tientonaudio_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools
    networks:
      - tientonaudio_net

volumes:
  postgres_data:
    name: tientonaudio_postgres_data
  redis_data:
    name: tientonaudio_redis_data

networks:
  tientonaudio_net:
    name: tientonaudio_network
    driver: bridge
